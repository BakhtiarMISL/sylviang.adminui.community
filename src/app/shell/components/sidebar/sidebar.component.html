<!-- Mobile Overlay -->
<div *ngIf="isMobile && mobileOverlayVisible" class="fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity duration-300" (click)="onOverlayClick()"></div>

<!-- Sidebar -->
<nav
  class="fixed inset-y-0 left-0 z-50 bg-light dark:bg-dark h-screen overflow-hidden transition-all duration-300 ease-in-out shadow-lg flex flex-col"
  [ngClass]="[sidebarWidthClasses, sidebarTransformClasses]"
  (mouseenter)="onSidebarMouseEnter()"
  (mouseleave)="onSidebarMouseLeave()"
  (click)="$event.stopPropagation()"
>
  <!-- Logo Section -->
  <div class="flex-shrink-0 pt-8 pb-6 px-4" [routerLink]="'/shift-list'">
    <div class="flex items-center cursor-pointer">
      <ng-container *ngIf="isDarkTheme; else lightMode">
        <img alt="Logo" class="transition-all duration-300 rounded-lg" [ngClass]="isVisuallyExpanded ? 'w-16 xl:w-20' : 'w-10 mx-auto'" src="assets/images/sylvia_logo.png" />
      </ng-container>
      <ng-template #lightMode>
        <img alt="Logo" class="transition-all duration-300 rounded-lg" [ngClass]="isVisuallyExpanded ? 'w-16 xl:w-20' : 'w-10 mx-auto'" src="assets/images/sylvia_logo.png" />
      </ng-template>
    </div>
  </div>

  <!-- Navigation Menu -->
  <div class="flex-1 px-2 pb-6 overflow-y-auto">
    <nav class="flex flex-col space-y-1">
      <ng-container *ngFor="let mainMenuItem of sidebarItems; let mainIndex = index">
        <ng-container *ngIf="!mainMenuItem.divider; else divider">
          <app-sidebar-menu-item
            [item]="mainMenuItem"
            [parentPath]="[mainIndex]"
            [isMobile]="isMobile"
            [isVisuallyExpanded]="isVisuallyExpanded"
            [level]="0"
            (itemClick)="onMenuItemClick($event)"
            (toggleExpand)="onMenuToggleExpand($event)"
          ></app-sidebar-menu-item>
        </ng-container>
      </ng-container>
    </nav>
  </div>
</nav>

<!-- Divider Template -->
<ng-template #divider>
  <div class="my-2 h-px bg-gradient-to-r from-transparent via-borderLight dark:via-neutral to-transparent"></div>
</ng-template>
