<div class="relative">
  <a
    (click)="onClick($event)"
    [routerLink]="!hasChildren() ? item.href : null"
    [pTooltip]="item.title | translate"
    tooltipPosition="right"
    [class.bg-primary]="isActive()"
    class="flex items-center justify-between w-full cursor-pointer transition-all duration-200 rounded-lg group relative"
    [ngClass]="[
      !isMobile && !isVisuallyExpanded && level === 0 ? 'justify-center' : 'justify-between',
      level === 0 ? 'px-3 py-2' : 'py-1 px-2 ml-2 rounded-md',
      !isActive() ? 'hover:bg-borderDark/60 hover:text-white' : '',
    ]"
  >
    <!-- Icon and Label Container -->
    <div class="flex items-center min-w-0">
      <i
        [class]="item.icon"
        [ngClass]="getIconSizeClass()"
        class="flex-shrink-0 transition-colors duration-300 text-dark dark:text-white group-hover:text-white dark:group-hover:text-white"
        [class.text-light]="isActive()"
        [ngClass]="level === 0 ? '' : 'group-hover:animate-pulse'"
      ></i>

      <!-- Label - Show on mobile or when expanded on desktop -->
      <span
        class="text-sm font-medium transition-all duration-300 ease-in-out text-dark dark:text-white group-hover:text-white dark:group-hover:text-white whitespace-nowrap overflow-hidden"
        [class.text-light]="isActive()"
        [ngClass]="[level === 0 ? 'ml-3' : 'ml-3', isMobile || isVisuallyExpanded ? 'opacity-100 w-auto' : 'opacity-0 w-0', level === 0 ? '' : 'text-ellipsis']"
      >
        {{ item.title | translate }}
      </span>
    </div>

    <!-- Dropdown Arrow - Show if has children -->
    <ng-container *ngIf="hasChildren() && (isMobile || isVisuallyExpanded || level > 0)">
      <i
        [ngClass]="{ 'rotate-180': isExpanded() }"
        class="fas fa-chevron-down text-xs transition-transform duration-300 text-dark dark:text-white group-hover:text-white dark:group-hover:text-white flex-shrink-0"
        [class.text-light]="isActive()"
        [ngClass]="level === 0 ? '' : 'ml-2'"
      ></i>
    </ng-container>
  </a>

  <!-- Recursive Submenu -->
  <ng-container *ngIf="hasChildren() && isExpanded()">
    <div class="overflow-hidden transition-all duration-300 ease-in-out" [style.max-height]="isExpanded() ? 'none' : '0'" [style.opacity]="isExpanded() ? '1' : '0'">
      <div [ngClass]="getIndentClass()" class="mt-1 mr-2 border-l-2 border-primary" [style.border-opacity]="getBorderOpacity()">
        <ng-container *ngFor="let subItem of item.subItems; let subIndex = index">
          <app-sidebar-menu-item
            [item]="subItem"
            [parentPath]="getChildPath(subIndex)"
            [isMobile]="isMobile"
            [isVisuallyExpanded]="isVisuallyExpanded"
            [level]="level + 1"
            (itemClick)="onChildClick($event)"
            (toggleExpand)="onChildToggle($event)"
          ></app-sidebar-menu-item>
        </ng-container>
      </div>
    </div>
  </ng-container>
</div>
