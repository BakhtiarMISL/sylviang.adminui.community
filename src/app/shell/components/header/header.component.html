<header class="relative px-4 py-2 flex items-center justify-between transition-colors duration-300">
  <div class="flex items-center gap-2">
    <button
      (click)="toggleSidebar()"
      class="h-8 flex items-center text-black dark:text-borderLight hover:text-primary dark:hover:text-primary duration-300"
      [attr.aria-label]="'Toggle sidebar'"
      title="Toggle sidebar"
    >
      <i class="fas fa-bars"></i>
    </button>

    <div class="flex items-center">
      <div class="h-6 w-px bg-borderLight dark:bg-neutral mr-3"></div>

      <!-- Dynamic Breadcrumbs -->
      <nav class="flex items-center space-x-2" aria-label="Breadcrumb">
        <ng-container *ngFor="let breadcrumb of breadcrumbs; let i = index; let last = last; let first = first">
          <!-- Non-clickable non-active items (first item or explicitly non-clickable) -->
          <div
            *ngIf="!breadcrumb.active && (first || breadcrumb.isClickable === false)"
            class="text-borderDark dark:text-borderLight"
            [attr.aria-label]="breadcrumb.title"
            [pTooltip]="breadcrumb.tooltip || breadcrumb.title"
            tooltipPosition="bottom"
          >
            <i [class]="breadcrumb.icon + ' text-sm'"></i>
          </div>

          <!-- Clickable non-active items — icon only -->
          <button
            *ngIf="!breadcrumb.active && !first && breadcrumb.isClickable !== false"
            [routerLink]="breadcrumb.href"
            class="cursor-pointer transition-all duration-300 ease-in-out hover:text-primary dark:hover:text-primary text-borderDark dark:text-borderLight"
            [attr.aria-label]="'Navigate to ' + breadcrumb.title"
            [pTooltip]="breadcrumb.tooltip || breadcrumb.title"
            tooltipPosition="bottom"
          >
            <i [class]="breadcrumb.icon + ' text-sm'"></i>
          </button>

          <!-- Active item — icon + title -->
          <div *ngIf="breadcrumb.active" class="flex items-center space-x-2 text-dark dark:text-borderLight font-semibold">
            <i [class]="breadcrumb.icon + ' text-sm'"></i>
            <span class="text-sm font-medium">{{ breadcrumb.title }}</span>
          </div>

          <!-- Separator -->
          <svg *ngIf="!last" class="w-4 h-4 text-neutral flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </ng-container>
      </nav>
    </div>
  </div>

  <!-- Right side controls -->
  <div class="flex items-center space-x-4">
    <button
      (click)="goToNotifications()"
      class="relative h-8 flex items-center text-black dark:text-borderLight hover:text-primary dark:hover:text-primary duration-300"
      [attr.aria-label]="'Notifications'"
      [pTooltip]="'Notifications'"
      tooltipPosition="bottom"
    >
      <i class="fas fa-bell"></i>
      <p-badge
        *ngIf="(unreadCount$ | async) as unreadCount"
        [value]="displayUnreadCount(unreadCount)"
        severity="danger"
        [style]="{ position: 'absolute', top: '-6px', right: '-10px' }"
      ></p-badge>
    </button>

    <app-theme-toggle></app-theme-toggle>

    <div class="relative">
      <button
        (click)="toggleProfileMenu()"
        class="h-8 flex items-center gap-2 pl-1 pr-2 rounded-full border border-transparent hover:border-borderLight dark:hover:border-borderDark duration-300"
        [attr.aria-label]="'Account menu'"
        [attr.aria-expanded]="!profileMenuHidden"
      >
        <span class="w-7 h-7 rounded-full overflow-hidden border-2 border-primary flex items-center justify-center bg-gray-100 dark:bg-gray-800 shrink-0">
          <img *ngIf="photoUrl" [src]="photoUrl" alt="" class="w-full h-full object-cover" />
          <i *ngIf="!photoUrl" class="fas fa-user text-neutral text-xs"></i>
        </span>
        <span *ngIf="employeeCode" class="text-sm text-black dark:text-borderLight">{{ employeeCode }}</span>
        <i class="fas fa-chevron-down text-xs text-neutral transition-transform duration-200" [class.rotate-180]="!profileMenuHidden"></i>
      </button>

      <div
        *ngIf="!profileMenuHidden"
        class="absolute right-0 top-full mt-2 w-48 rounded-xl border border-borderLight dark:border-borderDark bg-light dark:bg-dark shadow-xl overflow-hidden z-20"
      >
        <button
          (click)="goToProfile()"
          class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-dark dark:text-borderLight hover:bg-gray-50 dark:hover:bg-white/5 duration-150"
        >
          <i class="fas fa-user text-neutral w-4"></i>
          <span>Profile</span>
        </button>
        <button
          (click)="goToChangePassword()"
          class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-dark dark:text-borderLight hover:bg-gray-50 dark:hover:bg-white/5 duration-150"
        >
          <i class="fas fa-key text-neutral w-4"></i>
          <span>Change Password</span>
        </button>
        <div class="border-t border-borderLight dark:border-borderDark"></div>
        <button
          (click)="logout()"
          class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-danger hover:bg-gray-50 dark:hover:bg-white/5 duration-150"
        >
          <i class="fas fa-right-from-bracket w-4"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>
</header>
