<p-dialog header="Forward message" [(visible)]="visible" [modal]="true" [dismissableMask]="true" [style]="{ width: '26rem' }" (onHide)="close()">
  <div *ngIf="loading" class="py-6 text-center text-sm text-neutral">Loading conversations...</div>

  <div *ngIf="!loading" class="max-h-80 overflow-y-auto flex flex-col gap-1">
    <button
      *ngFor="let conversation of conversations"
      type="button"
      (click)="toggle(conversation.chatConversationId)"
      class="w-full flex items-center gap-2.5 px-2 py-2 rounded-lg text-left hover:bg-gray-50 dark:hover:bg-white/5 duration-150"
      [ngClass]="{ 'bg-primary/10': selectedIds.includes(conversation.chatConversationId) }"
    >
      <span class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-semibold bg-primary/15 text-primary shrink-0 overflow-hidden">
        <img *ngIf="conversation.avatarUrl" [src]="avatarUrl(conversation.avatarUrl)" class="w-full h-full object-cover" alt="" />
        <ng-container *ngIf="!conversation.avatarUrl">
          <i *ngIf="conversation.type === 'Group'" class="fas fa-users"></i>
          <span *ngIf="conversation.type !== 'Group'">{{ initial(conversation.displayName) }}</span>
        </ng-container>
      </span>
      <span class="flex-1 min-w-0 text-sm text-dark dark:text-borderLight truncate">{{ conversation.displayName }}</span>
      <i *ngIf="selectedIds.includes(conversation.chatConversationId)" class="fas fa-circle-check text-primary"></i>
    </button>

    <p *ngIf="conversations.length === 0" class="text-center text-sm text-neutral py-6">No conversations yet.</p>
  </div>

  <ng-template pTemplate="footer">
    <button pButton severity="danger" (click)="close()">Cancel</button>
    <button pButton [disabled]="selectedIds.length === 0 || sending" (click)="send()">
      Send{{ selectedIds.length > 0 ? ' (' + selectedIds.length + ')' : '' }}
    </button>
  </ng-template>
</p-dialog>
