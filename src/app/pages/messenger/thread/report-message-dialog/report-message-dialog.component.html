<p-dialog header="Report message" [(visible)]="visible" [modal]="true" [dismissableMask]="true" [style]="{ width: '28rem' }" (onHide)="close()">
  <p class="text-sm text-neutral mb-2">Let HR/Admin know why this message violates community guidelines.</p>
  <textarea
    pInputTextarea
    rows="4"
    class="w-full rounded-lg border border-borderLight dark:border-borderDark bg-gray-50 dark:bg-white/5 text-dark dark:text-borderLight px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary"
    placeholder="Reason for reporting..."
    [(ngModel)]="reason"
  ></textarea>

  <ng-template pTemplate="footer">
    <button pButton severity="secondary" (click)="close()">Cancel</button>
    <button pButton [disabled]="!reason.trim() || submitting" (click)="submit()">Submit Report</button>
  </ng-template>
</p-dialog>
