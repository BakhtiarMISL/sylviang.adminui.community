<p-dialog [header]="headerText" [(visible)]="visible" [modal]="true" [dismissableMask]="true" [style]="{ width: '28rem' }" (onHide)="close()">
  <p class="grant-access-intro" *ngIf="employeeName">{{ introText }} <strong>{{ employeeName }}</strong>.</p>

  <div class="grant-access-form">
    <ng-container *ngIf="isGrantMode">
      <label>Username</label>
      <input pInputText type="text" placeholder="e.g. jane.doe" [(ngModel)]="username" />
    </ng-container>

    <label>Password</label>
    <div class="relative">
      <input pInputText [type]="showPassword ? 'text' : 'password'" placeholder="At least 8 characters" [(ngModel)]="temporaryPassword" class="w-full pr-10" />
      <button
        type="button"
        (click)="showPassword = !showPassword"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral hover:text-primary transition-colors"
        tabindex="-1"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
      >
        <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
      </button>
    </div>

    <ng-container *ngIf="isGrantMode">
      <label>Role</label>
      <p-select
        [options]="roleOptions"
        optionLabel="label"
        optionValue="value"
        [(ngModel)]="role"
        [appendTo]="'body'"
        [autoDisplayFirst]="false"
        styleClass="w-full"
      ></p-select>
    </ng-container>

    <div class="form-actions">
      <button pButton [disabled]="!canSubmit" (click)="submit()">{{ submitLabel }}</button>
      <button pButton severity="danger" (click)="close()">Cancel</button>
    </div>
  </div>
</p-dialog>
