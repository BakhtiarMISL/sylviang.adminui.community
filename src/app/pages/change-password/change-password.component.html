<section class="page-container">
  <p-panel header="Change Password">
    <ng-template #icons>
      <button [pTooltip]="'Back'" tooltipPosition="bottom" pButton severity="secondary" text (click)="goBack()">
        <i class="fa fa-arrow-left"></i>
        <span>Back</span>
      </button>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="max-w-md">
      <p class="text-sm text-borderDark dark:text-neutral mb-5">Update your account password. This does not affect Keycloak-authenticated accounts.</p>

      <!-- Current password -->
      <div class="mb-4">
        <label class="block mb-1.5 text-sm text-dark dark:text-borderLight">Current Password</label>
        <div class="relative">
          <input
            [type]="showCurrentPassword ? 'text' : 'password'"
            formControlName="currentPassword"
            autocomplete="current-password"
            class="w-full rounded-lg border px-4 py-3 pr-11 text-sm bg-light dark:bg-dark text-dark dark:text-borderLight focus:outline-none focus:ring-2 focus:ring-primary transition-colors"
            [class.border-danger]="(submitted && f['currentPassword'].invalid) || currentPasswordError"
            [class.border-borderLight]="!((submitted && f['currentPassword'].invalid) || currentPasswordError)"
            [class.dark:border-borderDark]="!((submitted && f['currentPassword'].invalid) || currentPasswordError)"
          />
          <button
            type="button"
            (click)="showCurrentPassword = !showCurrentPassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral hover:text-primary transition-colors"
            tabindex="-1"
            [attr.aria-label]="showCurrentPassword ? 'Hide password' : 'Show password'"
          >
            <i class="fas" [class.fa-eye]="!showCurrentPassword" [class.fa-eye-slash]="showCurrentPassword"></i>
          </button>
        </div>
        <p *ngIf="submitted && f['currentPassword'].errors?.['required']" class="mt-1.5 flex items-center gap-1.5 text-xs text-danger">
          <i class="fas fa-exclamation-triangle"></i>
          Current password is required
        </p>
        <p *ngIf="currentPasswordError" class="mt-1.5 flex items-center gap-1.5 text-xs text-danger">
          <i class="fas fa-exclamation-triangle"></i>
          {{ currentPasswordError }}
        </p>
      </div>

      <!-- New password -->
      <div class="mb-4">
        <label class="block mb-1.5 text-sm text-dark dark:text-borderLight">New Password</label>
        <div class="relative">
          <input
            [type]="showNewPassword ? 'text' : 'password'"
            formControlName="newPassword"
            autocomplete="new-password"
            class="w-full rounded-lg border px-4 py-3 pr-11 text-sm bg-light dark:bg-dark text-dark dark:text-borderLight focus:outline-none focus:ring-2 focus:ring-primary transition-colors"
            [class.border-danger]="submitted && f['newPassword'].invalid"
            [class.border-borderLight]="!(submitted && f['newPassword'].invalid)"
            [class.dark:border-borderDark]="!(submitted && f['newPassword'].invalid)"
          />
          <button
            type="button"
            (click)="showNewPassword = !showNewPassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral hover:text-primary transition-colors"
            tabindex="-1"
            [attr.aria-label]="showNewPassword ? 'Hide password' : 'Show password'"
          >
            <i class="fas" [class.fa-eye]="!showNewPassword" [class.fa-eye-slash]="showNewPassword"></i>
          </button>
        </div>
        <p *ngIf="submitted && f['newPassword'].errors?.['required']" class="mt-1.5 flex items-center gap-1.5 text-xs text-danger">
          <i class="fas fa-exclamation-triangle"></i>
          New password is required
        </p>
        <p *ngIf="submitted && f['newPassword'].errors?.['minlength']" class="mt-1.5 flex items-center gap-1.5 text-xs text-danger">
          <i class="fas fa-exclamation-triangle"></i>
          New password must be at least 8 characters
        </p>
      </div>

      <!-- Confirm new password -->
      <div class="mb-6">
        <label class="block mb-1.5 text-sm text-dark dark:text-borderLight">Confirm New Password</label>
        <div class="relative">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmNewPassword"
            autocomplete="new-password"
            class="w-full rounded-lg border px-4 py-3 pr-11 text-sm bg-light dark:bg-dark text-dark dark:text-borderLight focus:outline-none focus:ring-2 focus:ring-primary transition-colors"
            [class.border-danger]="submitted && (f['confirmNewPassword'].invalid || form.errors?.['passwordsMismatch'])"
            [class.border-borderLight]="!(submitted && (f['confirmNewPassword'].invalid || form.errors?.['passwordsMismatch']))"
            [class.dark:border-borderDark]="!(submitted && (f['confirmNewPassword'].invalid || form.errors?.['passwordsMismatch']))"
          />
          <button
            type="button"
            (click)="showConfirmPassword = !showConfirmPassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral hover:text-primary transition-colors"
            tabindex="-1"
            [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
          >
            <i class="fas" [class.fa-eye]="!showConfirmPassword" [class.fa-eye-slash]="showConfirmPassword"></i>
          </button>
        </div>
        <p *ngIf="submitted && f['confirmNewPassword'].errors?.['required']" class="mt-1.5 flex items-center gap-1.5 text-xs text-danger">
          <i class="fas fa-exclamation-triangle"></i>
          Please confirm your new password
        </p>
        <p *ngIf="submitted && !f['confirmNewPassword'].errors?.['required'] && form.errors?.['passwordsMismatch']" class="mt-1.5 flex items-center gap-1.5 text-xs text-danger">
          <i class="fas fa-exclamation-triangle"></i>
          Passwords do not match
        </p>
      </div>

      <div class="flex items-center gap-3">
        <button
          type="submit"
          [disabled]="loading"
          class="flex items-center justify-center gap-2 rounded-lg bg-gradient-to-r from-primary to-success-600 px-5 py-3 text-sm font-semibold text-white transition-opacity hover:opacity-90 disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <ng-container *ngIf="!loading; else saving">
            Update Password
          </ng-container>
          <ng-template #saving>
            <i class="fas fa-spinner fa-spin"></i>
            Updating...
          </ng-template>
        </button>
        <button
          type="button"
          (click)="goBack()"
          class="px-5 py-3 text-sm font-medium text-danger dark:text-danger-400 hover:text-danger-600 transition-colors"
        >
          Cancel
        </button>
      </div>
    </form>
  </p-panel>
</section>
