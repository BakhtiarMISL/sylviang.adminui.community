<section class="reviews-container">
  <h2 class="section-title">Reviews</h2>

  <div *ngIf="loading" class="skeleton-wrap">
    <p-skeleton width="100%" height="4rem" styleClass="mb-2"></p-skeleton>
  </div>

  <div *ngIf="!loading && reviews.length === 0" class="no-reviews">No reviews yet.</div>

  <div class="review-list" *ngIf="!loading && reviews.length > 0">
    <div class="review-card" *ngFor="let review of reviews">
      <div class="review-header">
        <div class="avatar"><i class="fa-solid fa-user"></i></div>
        <div class="header-text">
          <div class="reviewer-line">
            <span class="reviewer-name">{{ reviewerNames.get(review.reviewerId) || 'Unknown' }}</span>
            <span class="time" [title]="review.createdAt || ''">{{ review.createdAt | date: 'mediumDate' }}</span>
          </div>
          <p-rating [ngModel]="review.rating" [readonly]="true" [stars]="5"></p-rating>
        </div>
      </div>

      <p class="review-comment" *ngIf="review.comment">{{ review.comment }}</p>

      <div class="review-gallery" *ngIf="reviewImages.get(review.reviewId)?.length">
        <div class="review-image-tile" *ngFor="let image of reviewImages.get(review.reviewId)">
          <img [src]="servedUrl(image.imageUrl)" alt="Review photo" />
        </div>
      </div>
    </div>
  </div>

  <div class="review-form" *ngIf="canReview">
    <h3 class="form-title">Write a Review</h3>
    <p-rating [(ngModel)]="rating" [stars]="5"></p-rating>
    <textarea pInputTextarea rows="3" class="w-full" placeholder="Share your experience..." [(ngModel)]="comment"></textarea>

    <app-attachment-upload
      module="MarketplaceReview"
      [entityId]="listingId"
      [multiple]="true"
      [accept]="'.jpg,.jpeg,.png,.gif,.webp'"
      chooseLabel="Add Photos"
      (uploaded)="onImageUploaded($event)"
      (removed)="onImageRemoved($event)"
    ></app-attachment-upload>

    <button pButton [disabled]="!rating || submitting" (click)="submitReview()">Submit Review</button>
  </div>
</section>
