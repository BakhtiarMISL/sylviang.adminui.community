<div class="post-card">
  <div class="post-header">
    <div class="avatar">
      <img *ngIf="authorPhotoUrl" [src]="authorPhotoUrl" alt="" />
      <i *ngIf="!authorPhotoUrl" class="fa-solid fa-user"></i>
    </div>
    <div class="header-text">
      <div class="author-line">
        <a class="author-name" [routerLink]="['/community/profile', post.employeeId]">{{ authorName }}</a>
        <span class="dot">&middot;</span>
        <span class="time" [title]="post.createdAt | date: 'medium'">{{ post.createdAt | relativeTime : (timeTicker.now$ | async) }}</span>
        <span class="badge announcement-badge" *ngIf="post.isAnnouncement">
          <i class="fa-solid fa-bullhorn"></i> Announcement
        </span>
      </div>
      <div class="meta-line">
        <span>{{ post.visibility }}</span>
        <span *ngIf="post.isLocked" class="dot">&middot;</span>
        <span *ngIf="post.isLocked"><i class="fa-solid fa-lock"></i> Locked</span>
      </div>
    </div>

    <div class="post-actions" *ngIf="!editing">
      <button type="button" class="icon-btn" (click)="openSharePicker()" pTooltip="Share">
        <i class="fa-solid fa-share"></i>
      </button>
      <button type="button" class="icon-btn" *ngIf="isOwnPost" (click)="startEdit()" pTooltip="Edit"><i class="fa-solid fa-pen"></i></button>
      <button type="button" class="icon-btn" *ngIf="canModerate" (click)="toggleLocked()" [pTooltip]="post.isLocked ? 'Unlock comments' : 'Lock comments'">
        <i class="fa-solid" [ngClass]="post.isLocked ? 'fa-unlock' : 'fa-lock'"></i>
      </button>
      <button type="button" class="icon-btn" *ngIf="canModerate" (click)="toggleHidden()" [pTooltip]="post.isHidden ? 'Unhide post' : 'Hide post'">
        <i class="fa-solid" [ngClass]="post.isHidden ? 'fa-eye' : 'fa-eye-slash'"></i>
      </button>
      <button type="button" class="icon-btn" *ngIf="!isOwnPost" (click)="openReportDialog()" pTooltip="Report">
        <i class="fa-solid fa-flag"></i>
      </button>
      <button type="button" class="icon-btn danger" *ngIf="canEdit" (click)="delete()" pTooltip="Delete">
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>
  </div>

  <div class="post-body" *ngIf="!editing" [innerHTML]="renderedContent()" (click)="onContentClick($event)"></div>

  <div class="attachment-gallery" [class.single-attachment]="attachments.length === 1" *ngIf="!editing && attachments.length > 0">
    <div class="attachment-tile" *ngFor="let attachment of attachments">
      <img
        *ngIf="isImageAttachment(attachment)"
        [src]="servedUrl(attachment.filePath)"
        [alt]="attachment.fileName"
        (click)="openLightbox(attachment, $event)"
      />
      <video
        *ngIf="isVideoAttachment(attachment)"
        #videoEl
        [src]="servedUrl(attachment.filePath)"
        muted
        loop
        playsinline
        (click)="openLightbox(attachment, $event)"
      ></video>
      <a
        *ngIf="isDocumentAttachment(attachment)"
        class="document-tile"
        [href]="servedUrl(attachment.filePath)"
        target="_blank"
        rel="noopener"
        (click)="$event.stopPropagation()"
      >
        <i class="fa-solid fa-file-lines"></i>
        <span class="document-name">{{ attachment.fileName }}</span>
      </a>
    </div>
  </div>

  <app-poll-widget *ngIf="!editing && post.isPoll" [postId]="post.postId"></app-poll-widget>

  <div class="post-edit-form" *ngIf="editing">
    <app-mention-textarea
      [rows]="3"
      [value]="editContent"
      (valueChange)="editContent = $event"
      [mentions]="editTags"
      (mentionsChange)="editTags = $event"
    ></app-mention-textarea>
    <p-select
      [options]="visibilityOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="editVisibility"
      [appendTo]="'body'"
      styleClass="w-44 mt-2"
    ></p-select>
    <div class="edit-actions">
      <button pButton size="small" [disabled]="!editContent.trim()" (click)="saveEdit()">Save</button>
      <button pButton size="small" severity="danger" (click)="cancelEdit()">Cancel</button>
    </div>
  </div>

  <div class="post-footer">
    <app-reaction-bar targetType="Post" [targetId]="post.postId"></app-reaction-bar>
    <button type="button" class="link-action" (click)="toggleComments()">
      <i class="fa-regular fa-comment"></i>
      {{ showComments ? 'Hide comments' : 'Comments' }}
      <span *ngIf="commentCount > 0">({{ commentCount }})</span>
    </button>
  </div>

  <app-comment-thread
    *ngIf="showComments"
    [postId]="post.postId"
    [postLocked]="post.isLocked"
    (countChanged)="onCommentCountChanged($event)"
  ></app-comment-thread>

  <app-report-content-dialog [postId]="post.postId" [(visible)]="showReportDialog"></app-report-content-dialog>

  <app-share-post-picker [postId]="post.postId" [(visible)]="showSharePicker"></app-share-post-picker>

  <p-dialog
    header="Attachment"
    [(visible)]="lightboxVisible"
    [modal]="true"
    [dismissableMask]="true"
    appendTo="body"
    [style]="{ width: '90vw', height: '90vh' }"
    [contentStyle]="{ height: '100%' }"
    styleClass="lightbox-dialog"
  >
    <div class="lightbox-content" *ngIf="lightboxAttachment as attachment">
      <img *ngIf="isImageAttachment(attachment)" [src]="servedUrl(attachment.filePath)" [alt]="attachment.fileName" />
      <video *ngIf="isVideoAttachment(attachment)" [src]="servedUrl(attachment.filePath)" controls></video>
    </div>

    <ng-template pTemplate="footer">
      <button type="button" pButton severity="secondary" *ngIf="lightboxAttachment as attachment" (click)="downloadAttachment(attachment)">
        <i class="fa-solid fa-download"></i>
        <span>Download</span>
      </button>
    </ng-template>
  </p-dialog>

  <p-dialog
    *ngIf="!isModalView"
    header="Post"
    [(visible)]="showDetailModal"
    [modal]="true"
    [dismissableMask]="true"
    [style]="{ width: '42rem' }"
    [contentStyle]="{ 'max-height': '80vh', 'overflow-y': 'auto' }"
  >
    <app-post-card *ngIf="showDetailModal" [post]="post" [isModalView]="true" (deleted)="onModalPostDeleted($event)"></app-post-card>
  </p-dialog>
</div>
