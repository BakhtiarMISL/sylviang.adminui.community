<section class="page-container feed-page">
  <div class="feed-header">
    <div class="feed-header-left">
      <app-colleague-search></app-colleague-search>
    </div>

    <p-select
      [options]="[
        { label: 'All Posts', value: 'all' },
        { label: 'Announcements', value: 'announcements' },
        { label: 'Polls', value: 'polls' },
      ]"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="typeFilter"
      [appendTo]="'body'"
      (onChange)="onTypeFilterChange()"
      styleClass="w-48"
    ></p-select>
  </div>

  <div class="feed-layout">
    <aside class="feed-sidebar">
      <app-profile-summary></app-profile-summary>
      <app-groups-sidebar></app-groups-sidebar>
    </aside>

    <div class="feed-main">
      <div *ngIf="highlightedPost" class="highlighted-post-banner">
        <p>Viewing a reported post &mdash; <a [routerLink]="[]" (click)="clearHighlightedPost()">back to Feed</a></p>
        <app-post-card [post]="highlightedPost" [autoOpenModal]="true" (deleted)="clearHighlightedPost()"></app-post-card>
      </div>

      <app-post-composer (posted)="onPostCreated()"></app-post-composer>

      <div *ngIf="loading" class="skeleton-list">
        <p-skeleton width="100%" height="8rem" styleClass="mb-3"></p-skeleton>
        <p-skeleton width="100%" height="8rem" styleClass="mb-3"></p-skeleton>
        <p-skeleton width="100%" height="8rem"></p-skeleton>
      </div>

      <div *ngIf="!loading">
        <app-post-card *ngFor="let post of posts" [post]="post" (deleted)="onPostDeleted($event)"></app-post-card>

        <div class="not-found" *ngIf="posts.length === 0">
          <div>
            <i class="fa fa-stream"></i>
            <p>No posts yet. Be the first to share something with the company!</p>
          </div>
        </div>

        <div *ngIf="loadingMore" class="load-more-spinner"><i class="fa-solid fa-spinner fa-spin"></i></div>
      </div>

      <div #scrollAnchor class="scroll-anchor"></div>
    </div>

    <aside class="feed-sidebar feed-sidebar-right">
      <app-today-events-card></app-today-events-card>
      <app-new-joinees-card></app-new-joinees-card>
    </aside>
  </div>
</section>
