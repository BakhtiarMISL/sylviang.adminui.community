<div class="group-posts-tab">
  <div *ngIf="!canView" class="not-found">
    <div>
      <i class="fa-solid fa-lock"></i>
      <p>Join this group to see its posts.</p>
    </div>
  </div>

  <ng-container *ngIf="canView">
    <app-post-composer *ngIf="canPost" [groupId]="groupId" (posted)="onPostCreated()"></app-post-composer>

    <div *ngIf="loading" class="skeleton-list">
      <p-skeleton width="100%" height="8rem" styleClass="mb-3"></p-skeleton>
      <p-skeleton width="100%" height="8rem"></p-skeleton>
    </div>

    <div *ngIf="!loading">
      <app-post-card *ngFor="let post of posts" [post]="post" [groupModerator]="canModerate" (deleted)="onPostDeleted($event)"></app-post-card>

      <div class="not-found" *ngIf="posts.length === 0">
        <div>
          <i class="fa fa-stream"></i>
          <p>No posts in this group yet.</p>
        </div>
      </div>

      <div *ngIf="loadingMore" class="load-more-spinner"><i class="fa-solid fa-spinner fa-spin"></i></div>
      <div #scrollAnchor class="scroll-anchor"></div>
    </div>
  </ng-container>
</div>
