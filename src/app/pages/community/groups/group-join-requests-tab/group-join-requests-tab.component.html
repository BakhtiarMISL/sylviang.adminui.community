<div class="join-requests-tab">
  <div *ngIf="loading" class="skeleton-list">
    <p-skeleton width="100%" height="2.5rem" styleClass="mb-2"></p-skeleton>
    <p-skeleton width="100%" height="2.5rem"></p-skeleton>
  </div>

  <div class="table-container" *ngIf="!loading">
    <p-table [value]="requests" dataKey="groupJoinRequestId">
      <ng-template pTemplate="header">
        <tr>
          <th>Requester</th>
          <th>Requested</th>
          <th></th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-request>
        <tr>
          <td>{{ nameFor(request.employeeId) }}</td>
          <td>{{ request.createdAt | date: 'dd-MMM-yyyy HH:mm' }}</td>
          <td class="actions-cell">
            <button
              pButton
              size="small"
              severity="success"
              [disabled]="pendingActionRequestId === request.groupJoinRequestId"
              (click)="approve(request)"
            >
              <i class="fa-solid fa-check"></i> Approve
            </button>
            <button
              pButton
              size="small"
              severity="secondary"
              [disabled]="pendingActionRequestId === request.groupJoinRequestId"
              (click)="reject(request)"
            >
              <i class="fa-solid fa-xmark"></i> Reject
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3" class="not-found">
            <div>
              <i class="fa-solid fa-inbox"></i>
              <p>No pending join requests.</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
