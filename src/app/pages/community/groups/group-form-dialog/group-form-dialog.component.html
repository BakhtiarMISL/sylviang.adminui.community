<p-dialog
  [header]="groupId === null ? 'Create Group' : 'Edit Group'"
  [(visible)]="visible"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '34rem' }"
  (onHide)="close()"
>
  <div class="group-form">
    <label>Name</label>
    <input pInputText type="text" placeholder="Group name" [(ngModel)]="name" />

    <label>Description</label>
    <textarea pTextarea rows="3" placeholder="What is this group about?" [(ngModel)]="description"></textarea>

    <label>Visibility</label>
    <div class="visibility-options">
      <div class="visibility-option">
        <p-radioButton name="visibility" value="Public" [(ngModel)]="visibility" inputId="visibility-public"></p-radioButton>
        <label for="visibility-public">Public - anyone can join instantly</label>
      </div>
      <div class="visibility-option">
        <p-radioButton name="visibility" value="Private" [(ngModel)]="visibility" inputId="visibility-private"></p-radioButton>
        <label for="visibility-private">Private - membership requires approval</label>
      </div>
    </div>

    <div class="form-actions">
      <button pButton size="small" [disabled]="!name.trim() || submitting" (click)="save()">Save</button>
      <button pButton size="small" severity="danger" (click)="close()">Cancel</button>
    </div>
  </div>
</p-dialog>
