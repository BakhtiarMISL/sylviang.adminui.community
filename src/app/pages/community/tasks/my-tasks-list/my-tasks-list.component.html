<div class="my-tasks">
  <div class="board-toolbar">
    <p-select
      [options]="statusOptions"
      placeholder="All Statuses"
      [showClear]="true"
      [(ngModel)]="statusFilter"
      (onChange)="onFilterChange()"
      (onClear)="onFilterChange()"
    ></p-select>
  </div>

  <div class="table-container">
    <p-table
      [value]="loading ? skeletonItems : tasks"
      dataKey="taskId"
      [paginator]="true"
      [rows]="rows"
      [first]="(currentPage - 1) * rows"
      [rowsPerPageOptions]="UI_CONFIG.pageSizeOptions"
      [totalRecords]="totalRecords"
      (onPage)="onPageChange($event)"
      [lazy]="true"
      [loading]="false"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} tasks"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Title</th>
          <th>Assigned By</th>
          <th>Priority</th>
          <th>Due Date</th>
          <th>Status</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-task>
        @if (loading) {
          <tr>
            <td colspan="5" class="p-4"><p-skeleton width="100%" height="2.5rem"></p-skeleton></td>
          </tr>
        } @else {
          <tr class="task-row" (click)="openTask(task)">
            <td>{{ task.title }}</td>
            <td>{{ nameFor(task.assignedBy) }}</td>
            <td>{{ task.priority }}</td>
            <td>{{ task.dueDate ? (task.dueDate | date: 'dd-MMM-yyyy') : '-' }}</td>
            <td>
              <span class="badge status-badge" [ngClass]="'status-' + statusSeverity(task)">{{ task.derivedStatus }}</span>
            </td>
          </tr>
        }
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="not-found">
            <div>
              <i class="fa-solid fa-list-check"></i>
              <p>No tasks assigned to you.</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<app-task-detail-dialog [(visible)]="showDetailDialog" [taskId]="openTaskId" (changed)="onTaskChanged()"></app-task-detail-dialog>
