<p-dialog
  [header]="teamId === null ? 'Create Team' : 'Edit Team'"
  [(visible)]="visible"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '34rem' }"
  (onHide)="close()"
>
  <div class="team-form">
    <label>Name</label>
    <input pInputText type="text" placeholder="Team name" [(ngModel)]="name" />

    <label>Description</label>
    <textarea pTextarea rows="3" placeholder="What does this team do?" [(ngModel)]="description"></textarea>

    <label>Supervisor</label>
    <div *ngIf="!selectedSupervisor" class="supervisor-search">
      <p-autoComplete
        [(ngModel)]="supervisorQuery"
        [suggestions]="supervisorSuggestions"
        field="employeeName"
        placeholder="Search by name..."
        (completeMethod)="searchSupervisors($event)"
        (onSelect)="onSupervisorSelect($event.value)"
        styleClass="w-full"
      ></p-autoComplete>
      <small *ngIf="teamId !== null" class="hint">Leave blank to keep the current supervisor.</small>
    </div>
    <div *ngIf="selectedSupervisor" class="selected-supervisor">
      <span>{{ selectedSupervisor.employeeName }}</span>
      <button pButton type="button" size="small" severity="secondary" (click)="clearSupervisor()">Change</button>
    </div>

    <div class="form-actions">
      <button pButton size="small" [disabled]="!name.trim() || submitting" (click)="save()">Save</button>
      <button pButton size="small" severity="danger" (click)="close()">Cancel</button>
    </div>
  </div>
</p-dialog>
