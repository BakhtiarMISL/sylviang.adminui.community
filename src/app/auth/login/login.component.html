<div class="relative min-h-screen overflow-hidden bg-gradient-to-br from-success-50 via-light to-success-100 dark:from-dark dark:via-dark dark:to-dark flex items-center justify-center p-4">
  <!-- Decorative blurred circles -->
  <div class="pointer-events-none absolute -top-24 -right-24 h-80 w-80 rounded-full bg-success-200/60 dark:bg-success-900/20 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-28 -left-24 h-72 w-72 rounded-full bg-primary/20 dark:bg-primary/10 blur-3xl"></div>

  <div class="relative z-10 w-full max-w-md rounded-2xl border border-borderLight dark:border-borderDark bg-light dark:bg-dark shadow-2xl p-8">
    <div class="flex flex-col items-center mb-6">
      <img src="assets/images/sylvia_logo.png" alt="Sylvia" class="h-16 object-contain mb-3" />
      <p class="text-neutral dark:text-borderLight text-sm">Please sign in to your account</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <!-- Username -->
      <div class="mb-4">
        <input
          type="text"
          formControlName="username"
          placeholder="Username"
          autocomplete="username"
          class="w-full rounded-lg border px-4 py-3 text-sm bg-light dark:bg-dark text-dark dark:text-borderLight placeholder-neutral focus:outline-none focus:ring-2 focus:ring-primary transition-colors"
          [class.border-danger]="submitted && f['username'].invalid"
          [class.border-borderLight]="!(submitted && f['username'].invalid)"
          [class.dark:border-borderDark]="!(submitted && f['username'].invalid)"
        />
        <p *ngIf="submitted && f['username'].invalid" class="mt-1.5 flex items-center gap-1.5 text-xs text-danger">
          <i class="fas fa-exclamation-triangle"></i>
          Username is required
        </p>
      </div>

      <!-- Password -->
      <div class="mb-2">
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Password"
            autocomplete="current-password"
            class="w-full rounded-lg border px-4 py-3 pr-11 text-sm bg-light dark:bg-dark text-dark dark:text-borderLight placeholder-neutral focus:outline-none focus:ring-2 focus:ring-primary transition-colors"
            [class.border-danger]="submitted && f['password'].invalid"
            [class.border-borderLight]="!(submitted && f['password'].invalid)"
            [class.dark:border-borderDark]="!(submitted && f['password'].invalid)"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral hover:text-primary transition-colors"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            tabindex="-1"
          >
            <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
          </button>
        </div>
        <p *ngIf="submitted && f['password'].invalid" class="mt-1.5 flex items-center gap-1.5 text-xs text-danger">
          <i class="fas fa-exclamation-triangle"></i>
          Password is required
        </p>
      </div>

      <div class="mb-6 text-right">
        <a href="javascript:void(0)" class="text-sm font-medium text-success-600 hover:text-success-700 hover:underline">Forgot password?</a>
      </div>

      <p *ngIf="loginError" class="mb-4 rounded-lg bg-danger-50 px-4 py-2.5 text-sm text-danger-700 flex items-center gap-2">
        <i class="fas fa-circle-exclamation"></i>
        {{ loginError }}
      </p>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full flex items-center justify-center gap-2 rounded-lg bg-gradient-to-r from-primary to-success-600 py-3 text-sm font-semibold text-white transition-opacity hover:opacity-90 disabled:opacity-60 disabled:cursor-not-allowed"
      >
        <ng-container *ngIf="!loading; else signingIn">
          Sign In
          <i class="fas fa-arrow-right"></i>
        </ng-container>
        <ng-template #signingIn>
          <i class="fas fa-spinner fa-spin"></i>
          Signing in...
        </ng-template>
      </button>
    </form>

    <!-- Demo accounts -->
    <div class="mt-6 border-t border-borderLight dark:border-borderDark pt-4">
      <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-neutral">Demo accounts</p>
      <ul class="space-y-1.5">
        <li
          *ngFor="let account of demoAccounts"
          class="flex items-center justify-between rounded-lg bg-success-50 dark:bg-dark px-3 py-2 text-xs"
        >
          <span class="text-dark dark:text-borderLight">
            <span class="font-semibold">{{ account.role }}</span>
            <span class="text-neutral"> &middot; {{ account.username }} / {{ account.password }}</span>
          </span>
          <button
            type="button"
            (click)="fillDemoAccount(account)"
            class="ml-2 shrink-0 rounded-md border border-success-600 px-2 py-1 font-medium text-success-600 hover:bg-success-600 hover:text-white transition-colors"
          >
            Use
          </button>
        </li>
      </ul>
    </div>
  </div>

  <!-- Theme / language controls -->
  <div class="fixed bottom-6 right-6 z-20 flex items-center gap-3">
    <app-theme-toggle></app-theme-toggle>
    <button
      type="button"
      class="border-2 border-borderLight dark:border-neutral rounded-full w-11 h-11 flex items-center justify-center text-borderDark dark:text-borderLight hover:border-primary hover:bg-primary hover:text-white transition-all duration-300"
      title="Language"
      aria-label="Language"
    >
      <i class="fas fa-globe"></i>
    </button>
  </div>
</div>
